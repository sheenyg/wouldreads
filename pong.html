<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pong Game</title>
    <link rel="stylesheet" href="pong.css">
</head>
<body>
    <div class="game-container">
        <h1>PONG</h1>
        <div class="score-board">
            <div class="score">
                <span class="label">Player 1</span>
                <span id="player1Score" class="score-value">0</span>
            </div>
            <div class="score">
                <span class="label">Player 2</span>
                <span id="player2Score" class="score-value">0</span>
            </div>
        </div>
        <canvas id="pongCanvas" width="800" height="600"></canvas>
        <div class="controls">
            <div class="control-group">
                <h3>Player 1 Controls</h3>
                <p>W - Move Up</p>
                <p>S - Move Down</p>
            </div>
            <div class="control-group">
                <h3>Player 2 Controls</h3>
                <p>↑ - Move Up</p>
                <p>↓ - Move Down</p>
            </div>
        </div>
        <div id="gameMessage" class="game-message hidden"></div>
        <button id="startButton" class="start-button">Start Game</button>
        <button id="restartButton" class="restart-button hidden">Play Again</button>
    </div>
    <script src="pong.js"></script>
</body>
</html>
