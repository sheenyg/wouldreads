<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pong Game</title>
    <link rel="stylesheet" href="pong.css">
</head>
<body>
    <div id="game-container">
        <div id="start-screen">
            <h1>PONG</h1>
            <div class="menu">
                <button id="two-player-btn" class="menu-btn">Two Players</button>
                <button id="ai-player-btn" class="menu-btn">Play vs AI</button>
            </div>
            <div class="controls-info">
                <p><strong>Controls:</strong></p>
                <p>Left Player: W (up) / S (down)</p>
                <p>Right Player: ↑ (up) / ↓ (down)</p>
                <p>Press SPACE to pause</p>
            </div>
        </div>
        
        <div id="game-screen" style="display: none;">
            <div id="score-display">
                <span id="player1-score">0</span>
                <span class="separator">-</span>
                <span id="player2-score">0</span>
            </div>
            <canvas id="pong-canvas"></canvas>
            <div id="pause-overlay" style="display: none;">
                <h2>PAUSED</h2>
                <p>Press SPACE to resume</p>
                <button id="return-menu-btn" class="menu-btn">Return to Menu</button>
            </div>
        </div>
    </div>
    
    <script src="pong.js"></script>
</body>
</html>
